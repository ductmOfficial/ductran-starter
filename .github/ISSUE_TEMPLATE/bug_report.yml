name: Bug report
description: Something does not work as expected.
title: "fix: "
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `pnpm ...`
        2. ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Error messages or logs. Pasted text is formatted as code automatically.
      render: shell
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "macOS 15, Node 24.22, pnpm 12.14"
